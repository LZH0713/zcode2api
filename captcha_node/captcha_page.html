<!DOCTYPE html>
<!-- 阿里云无痕验证 SDK 宿主页（无 CDP/自动化痕迹，普通 Chrome 打开即可自循环出 param）。
     页面自行：动态加载 SDK（带重试）→ init → startTracelessVerification → 把 param
     POST 回 provider → 延时刷新页面换新 SDK 实例（对齐 App「每次验证前重 init」）。 -->
<html lang="zh">
<head><meta charset="utf-8"><title>captcha worker</title></head>
<body>
<div id="captcha-element"></div>
<button id="captcha-button">start</button>
<script>
const Q = new URLSearchParams(location.search);
const SCENE = Q.get('scene') || '11xygtvd';
const REGION = Q.get('region') || 'sgp';
const PREFIX = Q.get('prefix') || 'no8xfe';
const RELOAD_DELAY_MS = Number(Q.get('reload') || 55000);
const SDK_URL = 'https://o.alicdn.com/captcha-frontend/aliyunCaptcha/AliyunCaptcha.js';

let settled = false;

function report(ok, param, info) {
  return fetch('/report?ok=' + (ok ? 1 : 0), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ param: param || null, info: info || null }),
  }).catch(() => {});
}

function settle(ok, param, info) {
  if (settled) return;
  settled = true;
  report(ok, param, info).finally(() => {
    setTimeout(() => location.reload(), RELOAD_DELAY_MS + Math.random() * 5000);
  });
}

window.addEventListener('error', (e) => {
  report(false, null, { code: 'PAGE_ERROR', raw: String(e.message || e.error).slice(0, 200) });
});

// 看门狗：40s 内无结果则上报并刷新
setTimeout(() => {
  if (!settled) {
    report(false, null, { code: 'PAGE_TIMEOUT' }).finally(() => location.reload());
  }
}, 40000);

// 对齐 ZCode App 的失败分类：fail 回调里若直接带了可用的 captchaVerifyParam 也算成功
function extractParamFromFail(e) {
  if (!e || typeof e !== 'object') return null;
  const v = e.captchaVerifyParam || e.CaptchaVerifyParam;
  return (typeof v === 'string' && v.trim()) ? v.trim() : null;
}

function loadSdk(attempt) {
  const s = document.createElement('script');
  s.src = SDK_URL + (attempt > 0 ? '?t=' + Date.now() : '');
  s.async = true;
  s.onload = () => start();
  s.onerror = () => {
    if (attempt < 3) setTimeout(() => loadSdk(attempt + 1), 2000);
    else { report(false, null, { code: 'SDK_LOAD_FAILED' }); setTimeout(() => location.reload(), 15000); }
  };
  document.head.appendChild(s);
}

function start() {
  if (typeof initAliyunCaptcha !== 'function') {
    report(false, null, { code: 'SDK_NOT_LOADED' });
    setTimeout(() => location.reload(), 15000);
    return;
  }
  window.AliyunCaptchaConfig = { region: REGION, prefix: PREFIX };
  initAliyunCaptcha({
    SceneId: SCENE, mode: 'popup', language: 'cn', region: REGION, prefix: PREFIX,
    element: '#captcha-element', button: '#captcha-button', showErrorTip: false,
    getInstance: (inst) => {
      if (typeof inst.startTracelessVerification === 'function') {
        setTimeout(() => inst.startTracelessVerification(), 800 + Math.random() * 1200);
      }
    },
    success: (param) => {
      if (param && param.length) settle(true, param);
      else settle(false, null, { code: 'EMPTY_SUCCESS' });
    },
    fail: (e) => {
      const p = extractParamFromFail(e);
      if (p) { settle(true, p); return; }
      settle(false, null, { code: (e && e.verifyCode) || 'FAIL' });
    },
    onError: () => settle(false, null, { code: 'SDK_ERROR' }),
  });
}

loadSdk(0);
</script>
</body>
</html>
